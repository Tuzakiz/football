<!DOCTYPE html>

<head>

</head>
<body>

        <main class="hub-container">
        

        <div class="coluna-direita">

            <div class="tag-categoria" id="texto-tag">JOGOS</div>


            <h2 class="titulo-secao" id="texto-titulo">Tabela de Classificação do Grupo A</h2>





        </div>
            <div class="tag-categoria" id="texto-tag">SELEÇÕES</div>
            <h2 class="titulo-secao" id="texto-titulo">Conheça os Convocados Oficiais</h2>
                <div class="coluna-esquerda bord">
            <img id="imagem-principal" src="https://meuvozao.com/wp-content/uploads/2022/04/20180816185251_527.jpeg" alt="Seção Atual">
            <div class="conteudo-sobreposto">
            <div class="slide-secundario">
                <img id="imagem-secundaria" src="https://static.vecteezy.com/system/resources/thumbnails/027/829/024/small/close-up-of-many-soccer-players-kicking-a-football-on-a-field-competition-scene-created-with-generative-ai-technology-photo.jpg" alt="Destaque Rotativo" >
            </div>
            
            <div class="controles-navegacao">
                <button type="button" onclick="mudarSessao(-1)">◀ Anterior</button>
                <button type="button" onclick="mudarSessao(1)">Próximo ▶</button>
            </div>
        </div>
    </main>



            <footer class="barra-carrossel-preta">
        <marquee behavior="scroll" direction="left" scrollamount="6">
             ÚLTIMAS NOTÍCIAS: Brasil estreia com vitória de 3x0! |  França e Argentina empatam em jogo eletrizante! |  KIKFY traz a cobertura completa direto do Qatar!
        </marquee>
    </footer>


    <script>

        const sessoesConteudo = [
            {
                tag: "JOGOS",
                titulo: "Tabela de Classificação do Grupo A",
                imgPrincipal: "https://www.shutterstock.com/image-photo/football-world-championship-soccer-player-600nw-2253076431.jpg"
            },
            {
                tag: "NOTÍCIAS",
                titulo: "Confira os Melhores Momentos da Rodada",
                imgPrincipal: "https://t3.ftcdn.net/jpg/12/38/29/06/360_F_1238290667_9GSAnNwNzyOe9cJXVfCmA6jpbv2SkdBd.jpg"
            },
            {
                tag: "SELEÇÕES",
                titulo: "Conheça os Convocados Oficiais",
                imgPrincipal: "https://img.olympics.com/images/image/private/t_s_16_9_g_auto/t_s_w1460/f_auto/primary/eokdbna3vwfkkb8t1yyy" 
            }
        ];

        let sessaoAtualIndex = 0;


        function mudarSessao(direcao) {
            sessaoAtualIndex += direcao;
            

            if (sessaoAtualIndex >= sessoesConteudo.length) sessaoAtualIndex = 0;
            if (sessaoAtualIndex < 0) sessaoAtualIndex = sessoesConteudo.length - 1;

            document.getElementById("texto-tag").innerText = sessoesConteudo[sessaoAtualIndex].tag;
            document.getElementById("texto-titulo").innerText = sessoesConteudo[sessaoAtualIndex].titulo;
            document.getElementById("imagem-principal").src = sessoesConteudo[sessaoAtualIndex].imgPrincipal;
        }

        const imagensSecundarias = ["https://static.vecteezy.com/system/resources/thumbnails/027/829/024/small/close-up-of-many-soccer-players-kicking-a-football-on-a-field-competition-scene-created-with-generative-ai-technology-photo.jpg", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7wv8-73hPX3NoUBA6XjGw5NwUGZjBfhRUTQ&s", "https://as1.ftcdn.net/v2/jpg/02/65/22/78/1000_F_265227859_ZMqb2Po2FubWF0jgqe0Cn4ZdXx9SGpBf.jpg"];
        let slideIndex = 0;
        
        setInterval(function() {
            slideIndex++;
            if (slideIndex >= imagensSecundarias.length) slideIndex = 0;
            document.getElementById("imagem-secundaria").src = imagensSecundarias[slideIndex];
        }, 3000);
    </script>

    <script>
        const sizer = [
            {
                positio
            }
        ]
    </script>

</body>
</html>
